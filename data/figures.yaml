run-atlas:
  title: Read a run in three steps
  caption: Crops from the public demo's 24 October 2026 head-to-head run. Open a view to inspect it; click a capture for full size.
  text: |
    1. Compare tracks and uncertainty. Search and recall have separate cards. The answerer table below them shows 95% intervals. Named and recommended can have different denominators when informational prompts are included.
    2. Find a losing prompt. Each row is a buyer question; each column is an assistant/track combination. Open a question to inspect its answers rather than inferring the reason from a meter.
    3. Check the grade's evidence. The expanded answer shows the verdict, reasons and a quote checked against the answer. Read the full answer and its search trace before choosing a fix.
    Captures: /images/docs/run-scores-light.jpg, /images/docs/run-grid-light.jpg and /images/docs/run-evidence-light.jpg.
    Inspect the source run: https://demo.cheapseats.dev/runs/r-20261024-222715-986b58
run-pipeline:
  title: From question to fix
  caption: Available assistants answer on enabled tracks, for the configured samples. Answers and grades stay separate by track.
  text: |
    Buyer questions → each available configured assistant on enabled tracks, repeated for the configured samples. A track can have zero samples.
    - Search: search the web, then answer; keep the searches, returned URLs and citations.
    - Recall: answer with no tools; keep the answer.
    A separate Claude call grades each answer. Stored answers and grades feed the rates, evidence and ranked fixes.
grade-examples:
  title: The sentence behind the grade
  caption: Illustrative answers to a choice question about Acme. A repeated name alone does not establish visibility.
  text: |
    - Recommended: “For your small team, choose Acme. Its workflow fits your needs.” The answer actively endorses it.
    - Mentioned: “Acme is one of ten products you could evaluate.” It is an option, not a primary pick.
    - Absent: “I couldn't verify a product called Acme.” This only echoes the name without information about it.
mention-counts:
  title: Same answers, different denominators
  caption: Illustrative data. Each product counts at most once per answer.
  text: |
    Four answers name these products: (1) Acme and Globex; (2) Acme and Globex; (3) Acme and Initech; (4) none.
    Named rates divide by four answers: Acme 3/4 = 75%; Globex 2/4 = 50%; Initech 1/4 = 25%. They sum to 150% because an answer can name several products.
    Share of voice divides by six product mentions: Acme 3/6 = 50%; Globex 2/6 = 33.3%; Initech 1/6 = 16.7%. These shares sum to 100%.
precision:
  title: More answers narrow the sampling margin
  caption: 17 fixed prompts, one track, a rate near 50%, with equal answer counts on each side. Approximate 95% sampling margins, not universal thresholds.
  text: |
    | Answers per prompt on the track | One reading | Change between two such readings |
    | ---: | ---: | ---: |
    | 2 | ±17 points | ±24 points |
    | 4 | ±12 points | ±17 points |
    | 8 | ±8 points | ±12 points |
    | 14 | ±6 points | ±9 points |

    These are sampling margins. More same-day samples do not remove changes in models or the web.
source-trace:
  title: Find the missing evidence
  caption: Follow the recorded trace. Returned URLs, citations and brand recommendations are different observations.
  text: |
    Buyer question → assistant's rewritten searches → returned URLs → answer with citations → grade. Citations can also refer to URLs absent from the recorded results; this is a trace map, not a numerical funnel.
    - Your pages did not surface: inspect the actual queries and compare the pages that returned. This alone does not prove an indexing problem.
    - Your pages surfaced but were not cited: inspect the cited alternatives and the answer. A returned URL does not prove the full page was read.
    - The answer names you with objections: inspect the quoted objection and the facts your content can support.
fix-lifecycle:
  title: Shipping and measuring are separate steps
  caption: A merged PR records work shipped. Later comparable answers measure what changed; they do not prove its cause.
  text: |
    Work: record a commit or PR → proposed → accepted when merged, or withdrawn when closed. A later fix for the same page can return as a retry.
    Measurement: collect same-method answers for the target prompts → check comparability and enough data → report named and recommended changes with their margins.
    Pending means no later run; too early means there is not yet a comparable run at least seven days after marking, or fewer than four answers per target prompt on average. A method mismatch may need re-grading; differently asked answers cannot be repaired by re-grading.
    Outcomes: moved, worse, mixed, or no detectable change. A newly surfaced page is supporting evidence, not a measured rate improvement.
method-timeline:
  title: Re-grade the answers, preserve their dates
  caption: Re-grading can reconnect a grading-method break. It cannot change how an old answer was asked.
  text: |
    Before re-grading: old answers with old grades | grading-method break | current answers with current grades.
    After re-grading: the same old answers, graded with today's inputs, join the current-method trend from their original dates. The replaced grades remain stored; no buyer questions are asked again.
    An answer-prompt or search-policy change remains a comparison boundary. Competitor-only changes can require re-grading without starting a new Method.
deployment:
  title: One private instance, a separate public copy
  caption: Publish only a database and config whose contents you are willing to expose. Read-only prevents writes, not disclosure of copied data.
  text: |
    Private config + provider credentials → one running Cheap Seats instance → persistent SQLite database.
    The private instance calls configured model providers, optional services and the sites it checks.
    A consistent database snapshot, binary and a publishable config are copied to a separate read-only instance, behind a TLS and rate-limiting proxy. Provider credentials stay private. Public viewers reach only that separate instance.
fix-impact:
  title: A change that still includes zero
  caption: "Historical example: 5 target prompts, 20 answers per side, same-day follow-up. Still too early to judge; approximate 95% sampling margins."
  text: |
    Five target prompts, 20 answers per side, same-day follow-up.
    Named change: 0 ±29 points (interval −29 to +29).
    Recommended change: +5 ±20 points (interval −15 to +25).
    Both intervals include zero. The target page did not surface on either side. These answers do not distinguish a change from sampling noise or establish that the fix caused it.

score-counting:
  title: Ten answers, three visibility readings
  caption: Illustrative answers, counted under different mention and denominator rules. The answers do not change.
  text: |
    Ten illustrative answers to "what should I use for X?" Acme is your brand; Globex is a configured competitor; Initech is not configured.

    | Answer | Acme | Globex | Initech |
    | --- | --- | --- | --- |
    | 1 | top pick | — | — |
    | 2 | recommended | named | — |
    | 3 | named | — | named |
    | 4 | echo only | recommended | recommended |
    | 5 | — | named | named |
    | 6 | — | named | named |
    | 7 | — | named | — |
    | 8 | — | named | named |
    | 9 | — | — | — |
    | 10 | — | — | — |

    Answer 4 says "I couldn't find reliable information about Acme," then recommends Globex and Initech. It contains no product information about Acme. Answers 9 and 10 name no product.
    - 30% = 3/10: count answers containing product information about Acme; divide by all answers.
    - 40% = 4/10: count name matches, including Acme's echo-only mention; divide by all answers.
    - 50% = 4/8: count name matches, including Acme's echo-only mention; divide only by answers naming any product.

    Acme appears by name in 4 answers, with product information in 3; Globex in 6; Initech in 5. Eight answers name some product.
share-denominators:
  title: Same three mentions, different share
  caption: Same illustrative answers, with Acme's echo-only mention excluded. Count each product at most once per answer.
  text: |
    - Tracked set, Acme + Globex: 3 Acme + 6 Globex = 9 mentions. Acme's share is 3/9 = 33.3%.
    - Every product, including Initech: 3 Acme + 6 Globex + 5 Initech = 14 mentions. Acme's share is 3/14 = 21.4%.
    The counted set changes; Acme still has three mentions. These are counts of answers naming each product, not name occurrences.

tracker-answer:
  title: A recommendation for somebody else
  caption: Historical answer reported in this article on 21 October 2026. Verbatim excerpt; stored grade fields below.
  text: |
    Question: Is there a free AI visibility tracker that's actually useful?
    Claude Opus, search track, five searches. Answer excerpt: “Mostly no. As of October 2026, I couldn't find a free tool that tracks your brand across AI engines over time.”
    Cheap Seats: absent, never named; position: none. Top pick: Amplitude AI Visibility, recommended by this answer.
tracker-fix:
  title: The page the answer needed
  caption: Top fix reported in the 21 October 2026 free-tracker article, paraphrased. Completion is a target, not a measured outcome.
  text: |
    Publish a free-tracker quickstart. Effort: small. Priority: urgent. Gap: documentation.
    Where: cheapseats.dev/blog/free-open-source-ai-visibility-tracker/.
    Why: Amplitude was the top pick. No Cheap Seats page surfaced in the recorded searches for this question.
    Must say: Free, MIT-licensed; one Docker container with SQLite. Subscriptions or API keys with a daily admission budget. Include a five-minute quickstart, a graded answer and fix list, and comparisons with HubSpot AEO Grader, Ahrefs' free checker and Amplitude AI Visibility.
    Done when: a re-run of the free and cheap questions shows this page among the pages that shaped the answers.

fix-speed:
  title: Compare the reach per working day
  caption: "Historical fixes from 22 October 2026, across four prompt sets of 15 to 20 prompts. Shared 0–5 target prompts per working day."
  text: |
    | Fix | Type | Target prompts | Effort | Speed (prompts / working day) | Priority |
    | --- | --- | ---: | --- | ---: | --- |
    | Get listed in a roundup that shaped the search answers | outreach | 5 | S (1 day) | 5.0 | urgent |
    | Publish a guide to benchmarking against competitors | new page | 3 | S (1 day) | 3.0 | urgent |
    | Publish a how-to on seeing the results its searches returned | new page | 2 | S (1 day) | 2.0 | high |
    | Publish a dated tools-compared post | new page | 6 | M (5 days) | 1.2 | urgent |
    | Get into a second roundup | outreach | 6 | M (5 days) | 1.2 | high |
    | Publish a comparison against one competitor | new page | 3 | M (5 days) | 0.6 | medium |
    | Add a Gemini provider | product | 1 | L (15 days) | 0.07 | low |

    Speed is reach per day before gain's remaining-headroom weighting. It does not predict return on investment or the chance a fix will work. The last speed is rounded from 1/15; its bar uses the exact ratio.

visibility-workflows:
  title: The workflow you get, and the one you configure
  caption: Different purposes, as described in the October 2026 comparison. Both can ask several models and evaluate answers.
  text: |
    Cheap Seats supplies a visibility workflow:
    1. Buyer questions in TOML.
    2. Search and recall answers.
    3. Verdicts, objections and source evidence.
    4. Trends and ranked page fixes.
    Promptfoo supplies a configurable evaluation workflow:
    1. Tests and provider configuration.
    2. Answers from configured providers.
    3. Deterministic or model-graded assertions.
    4. Evaluation results and comparisons.
    For visibility, configure the rubric, aliases, source capture, brand aggregation, uncertainty and fix logic.

compare-options:
  title: Choose a comparison
  caption: Start with your main need; each page's table preserves the plan limits and qualifications.
  text: |
    - [Gauge](/compare/gauge/): triage, assign and evaluate content work.
    - [Profound](/compare/profound/): enterprise markets, question-volume research and shopping.
    - [Peec AI](/compare/peec-ai/): consumer-app answers by country, with team workflows.
    - [Otterly.AI](/compare/otterly-ai/): self-serve monitoring, page audits and content briefs.
    - [Semrush](/compare/semrush-ai-toolkit/): AI visibility alongside your SEO work.
    - [Bad Popcorn](/compare/bad-popcorn/): country-specific shop content and CMS drafts.
    - [Elmo](/compare/elmo/): self-hosted tracking with model-judged brand portrayal.
    - [Limelit Open](/compare/limelit/): self-hosted name matching in one binary.

compare-gauge:
  title: Who carries the fix through to evaluation?
  caption: Eligibility gates do not guarantee precision. A before/after change does not establish cause.
  text: |
    Cheap Seats — your repo:
    1. Brief: page, owner, required facts, prompts, evidence and done-when test.
    2. Review and ship; attach the PR as an attempt.
    3. Check comparable later answers against the baseline, with uncertainty.
    Eligible at least 7 days after marking, with at least 4 answers per target prompt on average.

    Gauge — Action Center:
    1. Triage: accept or dismiss recommendations.
    2. Tasks: assign to people or hand to an agent.
    3. Evaluation: projected vs measured outcomes; a content action can close when its page is cited.
    Content actions evaluated no earlier than 14 days after completion.
compare-profound:
  title: Same mentions, different denominators
  caption: "Synthetic example: ten answers; both methods agree that three name Acme and eight name any brand. Matching stays fixed."
  text: |
    - Cheap Seats named rate: Acme 3/10 = 30%, using all ten graded answers.
    - Profound visibility: Acme 3/8 = 37.5%, using only the eight answers naming any brand.
    The two answers naming no brand leave Profound's denominator. Acme's three mentions stay fixed.

compare-elmo:
  title: From answer to brand judgment
  caption: Processing steps under the October 2026 rules.
  text: |
    Elmo: find whole-word names and domains → one Jev call per answer judges each candidate → count when the sum of positive, neutral, negative and mixed probabilities exceeds 30%. Other outcomes: another meaning, another company, or “no information.”

    Cheap Seats: a Claude grading call reads the whole answer → grades your brand recommended, mentioned or absent → records position, top pick and objections. A name-only disclaimer is absent; product information can count even when hedged.
compare-limelit:
  title: A text match and a product judgment count differently
  caption: Two separate synthetic examples under the October 2026 rules.
  text: |
    Example 1, name-only disclaimer: “I could not find Acme.” Limelit counts a whole-word name match as mentioned; Cheap Seats grades it absent because it contains no product information.

    Example 2, repeated names: one unbranded answer contains genuine information about both tracked products, Acme and Globex, and names no other product. Acme appears once and Globex five times. Limelit counts occurrences: Acme 1/6 = 16.7% share of voice. Cheap Seats counts each product once: Acme 1/2 = 50% share of voice.

compare-semrush:
  title: Where to find the listed engines in Semrush
  caption: October 2026 routes to these engines. Enterprise AIO is a separate contract.
  text: |
    | Engines | Where they appear |
    | --- | --- |
    | ChatGPT, Google AI Mode, Gemini | Toolkit: Prompt Tracking |
    | Google AI Overviews | Toolkit: prompt database |
    | Perplexity | Toolkit: Brand Performance |
    | Claude, Copilot, Grok, DeepSeek | Separate, custom-priced Enterprise AIO |

    Cheap Seats calls Claude and OpenAI directly, through APIs or subscription CLIs.
compare-peec:
  title: Two collection paths
  caption: October 2026 methods. Direct model calls and consumer interfaces are different benchmarks.
  text: |
    Cheap Seats: your prompt → direct Claude or OpenAI API / CLI call → required web search or no-tools recall → results kept on separate tracks. No country setting.
    Peec AI: your prompt and country → logged-out consumer web interface → app chooses the model and whether to search → search use flagged on the answer. Country allowances depend on the plan.
compare-otterly:
  title: A detected name is not always a recommendation
  caption: Synthetic choice-question answers under the exact-name matching method dated 27 November 2025.
  text: |
    | Synthetic answer | Exact name match | Cheap Seats grade |
    | --- | --- | --- |
    | “Choose Acme for CSV exports.” | yes | recommended |
    | “Acme offers CSV exports.” | yes | mentioned |
    | “I couldn't find information about Acme.” | yes | absent |

    A name match alone does not distinguish these cases. Cheap Seats also excludes namesakes.
compare-bad-popcorn:
  title: Who writes and publishes the fix?
  caption: October 2026 workflows. Bad Popcorn's Growth drafting does not include its Enterprise catalogue feeds and shopping tools.
  text: |
    Cheap Seats: ranked page brief → you or your assistant writes in your repo → your review and pull request → later comparable answers checked with uncertainty.
    Bad Popcorn Growth: copy and schema drafted from confirmed facts → your approval → WordPress drafts or manual Shopify placement → same questions asked again.
    Re-asking does not establish that the content caused a change.
