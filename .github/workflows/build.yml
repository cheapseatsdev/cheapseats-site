name: Build

# Every pull request and push to main builds the site with the same Hugo and flags as the server,
# so a broken template or a warning fails here. cheapseats.dev is served from its own VM, which
# builds main itself (popcorn-zone-config's deploy/demo/site-build); nothing publishes from here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --panicOnWarning
