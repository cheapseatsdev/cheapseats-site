# Dependabot keeps the GitHub Actions and the brand build's npm packages current, one grouped pull
# request per ecosystem a week. Hugo is pinned by HUGO_VERSION in the build workflow and on the VM;
# bump both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  # sharp, which renders brand/ PNGs from their SVGs, pinned by brand/package-lock.json.
  - package-ecosystem: npm
    directory: /brand
    schedule:
      interval: weekly
      day: monday
    groups:
      brand:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
