{{ define "main" }}
<article class="wrap prose">
  <header class="page-heading">
    <p class="eyebrow"><a href="{{ "/blog/" | relURL }}">Blog</a></p>
    <h1>{{ .Title }}</h1>
    {{ partial "article-meta.html" . }}
  </header>
  <div class="article-content">{{ .Content }}</div>
  <p class="muted"><a href="{{ "/blog/" | relURL }}">All posts</a></p>
</article>
{{ end }}
