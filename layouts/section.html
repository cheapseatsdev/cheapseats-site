{{ define "main" }}
<div class="wrap prose">
  <header class="page-heading"><h1>{{ .Title }}</h1>{{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}</header>
  <div class="article-content">{{ .Content }}</div>
  <ul class="doc-list">{{ range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<p class="muted">{{ . }}</p>{{ end }}</li>{{ end }}</ul>
</div>
{{ end }}
