baseURL = "https://popcorn.zone/"
locale = "en-us"
title = "Popcorn"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
description = "Popcorn is an open-source (MIT), self-hosted AI visibility tracker. It asks Claude and OpenAI models your buyers' questions, grades whether they recommend you, and builds a ranked fix list."
github = "https://github.com/metcalfc/popcorn"
template = "https://github.com/metcalfc/popcorn-config-template"

# llms.txt (llmstxt.org): an index and a full-text file at the root, and a markdown copy of every
# page beside its HTML, linked from <head>.
[mediaTypes."text/markdown"]
suffixes = ["md"]

[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.llmsfull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "llms", "llmsfull"]
section = ["html", "rss", "markdown"]
page = ["html", "markdown"]

[services.rss]
limit = 20

[markup.highlight]
codeFences = false

[markup.goldmark.renderer]
unsafe = false

[menus]
[[menus.main]]
name = "Docs"
pageRef = "/docs"
weight = 10
[[menus.main]]
name = "Guides"
pageRef = "/guides"
weight = 15
[[menus.main]]
name = "Compare"
pageRef = "/compare"
weight = 18
[[menus.main]]
name = "Blog"
pageRef = "/blog"
weight = 20
[[menus.main]]
name = "GitHub"
url = "https://github.com/metcalfc/popcorn"
weight = 30
