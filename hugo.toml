baseURL = "https://cheapseats.dev/"
locale = "en-us"
title = "Cheap Seats"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

# The brand's design tokens live once, in brand/web/tokens.css. Mounted into assets so the
# stylesheet builds them in (layouts/baseof.html), and into static so a third consumer can fetch
# them at /brand/tokens.css. Declaring a mount drops that target's default, hence the two re-adds.
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "brand/web/tokens.css"
target = "assets/css/tokens.css"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "brand/web/tokens.css"
target = "static/brand/tokens.css"
# Safari and iOS ask for the touch icon at the root, whatever the page links.
[[module.mounts]]
source = "static/brand/apple-touch-icon.png"
target = "static/apple-touch-icon.png"

[params]
description = "Cheap Seats is an MIT-licensed, self-hosted tracker of Claude and OpenAI answers. It grades recommendations, keeps the evidence and ranks page fixes."
github = "https://github.com/cheapseatsdev/cheapseats"
# How every page title, meta description and the footer name the product.
tagline = "the open-source AI visibility tracker"
# The home page's meta description: 160 characters at most, so search results show all of it.
metaDescription = "Free, self-hosted AI visibility software for Claude and OpenAI. Check recommendations, inspect evidence and rank page fixes."
template = "https://github.com/cheapseatsdev/cheapseats-config-template"
# The docs index and sidebar group pages under these headings, in this order (front matter `group`).
docGroups = ["Start here", "Reading what it finds", "Acting on it", "Running it"]

# llms.txt (llmstxt.org): an index and a full-text file at the root, and a markdown copy of every
# page beside its HTML, linked from <head>.
[mediaTypes."text/markdown"]
suffixes = ["md"]

[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.llmsfull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "markdown", "llms", "llmsfull"]
section = ["html", "rss", "markdown"]
page = ["html", "markdown"]

[services.rss]
limit = 20

[markup.highlight]
codeFences = false

[markup.tableOfContents]
startLevel = 2
endLevel = 2

[markup.goldmark.renderer]
unsafe = false

# Render equations at build time. Single dollars remain ordinary currency.
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['\(', '\)']]

[menus]
[[menus.main]]
name = "Docs"
pageRef = "/docs"
weight = 10
[[menus.main]]
name = "Guides"
pageRef = "/guides"
weight = 15
[[menus.main]]
name = "Compare"
pageRef = "/compare"
weight = 18
[[menus.main]]
name = "Blog"
pageRef = "/blog"
weight = 20
[[menus.main]]
name = "Demo"
url = "https://demo.cheapseats.dev/"
weight = 25
[[menus.main]]
name = "GitHub"
url = "https://github.com/cheapseatsdev/cheapseats"
weight = 30
